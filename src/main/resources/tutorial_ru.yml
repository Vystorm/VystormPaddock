title: 'Загон'
permission: vystormpaddock.use
pages:
  - title: 'Присвоить животное'
    text: |
      Приручённые лошади становятся вашими сами. /paddock claim на животном; /paddock trust PLAYER разрешит другу ездить.
  - title: 'Конюшня и свисток'
    text: |
      /paddock открывает конюшню: храните животных и вызывайте их где угодно. /paddock call подзывает последнего.
  - title: 'Тренировки и скачки'
    text: |
      Тренируйте скакуна, чтобы он был быстрее, и участвуйте в скачках из меню.
      Введите /paddock help, чтобы увидеть все команды.
