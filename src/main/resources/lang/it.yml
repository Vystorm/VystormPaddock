commands:
  paddock:
    description: Rivendica, proteggi, stabili e convochi i tuoi cavalli; libri di mandria e corse di cavalli
    aliases: []
    sub:
      train:
        name: "train"
        aliases: []
        description: "Allena la tua cavalcatura nella corsa e nel salto entro limiti"
        args:
          exercise: "ESERCIZIO"
      claim:
        name: claim
        aliases: []
        description: Pretendiamo l'animale addomesticato che guardi o cavalca
      release:
        name: release
        aliases: []
        description: Rinuncia al tuo reclamo sull'animale
      offer:
        name: offer
        aliases: []
        description: "Offri l’animale che guardi a un giocatore"
        args:
          player: PLAYER
          price: PRICE
      accept:
        name: accept
        aliases: []
        description: "Accetta l’offerta ricevuta"
      decline:
        name: decline
        aliases: []
        description: "Rifiuta l’offerta ricevuta"
      trust:
        name: trust
        aliases: []
        description: Lasciare un giocatore cavalcare e utilizzare il vostro animale
        args:
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: Riprendere l'accesso di un giocatore al vostro animale
        args:
          player: PLAYER
      compare:
        name: compare
        aliases: []
        description: Confronta il tuo cavallo a cavallo con il cavallo che guardi
      info:
        name: info
        aliases: []
        description: Proprietario, giocatori fidati, statistiche e allevamento dell'animale
      rename:
        name: rename
        aliases: []
        description: Date un nome al vostro animale
        args:
          name: NAME
      store:
        name: store
        aliases: []
        description: Metti l'animale nella tua stalla
      list:
        name: list
        aliases: []
        description: Elenca gli animali nella tua stalla
      stable:
        name: stable
        aliases: []
        description: Apri il tuo stabile; nomi di ricerca opzionalmente o tipi di animali inglesi
        args:
          search: SEARCH
      summon:
        name: summon
        aliases: []
        description: Porta un animale fuori dalla tua stalla
        args:
          animal: NUMBER|NAME
      call:
        name: call
        aliases: []
        description: Whistle per l'animale che hai guidato l'ultimo
      herd:
        name: herd
        aliases: []
        description: Herd libro dei vostri animali fuori nel mondo; stop termina la freccia guida
        args:
          stop: ferma
      bet:
        name: bet
        aliases: []
        description: "Scommetti su un cavaliere alla partenza: batte o manca il suo record"
        args:
          rider: "RIDER"
          side: "beat|miss"
          amount: "AMOUNT"
      race:
        name: race
        aliases: []
        description: Corsi di gara, record e tempi; interrompere la corsa
        args:
          course: COURSE
      course:
        name: course
        aliases: []
        description: Disattivare e modificare i corsi di gara
        sub:
          create:
            name: create
            aliases: []
            description: Nuovo corso a partire da dove ti trovi
            args:
              course: COURSE
          point:
            name: point
            aliases: []
            description: Aggiungi un checkpoint dove ti trovi (l'ultimo è il traguardo)
            args:
              course: COURSE
          undo:
            name: undo
            aliases: []
            description: Rimuovi l'ultimo checkpoint
            args:
              course: COURSE
          radius:
            name: radius
            aliases: []
            description: Dimensioni dei punti di controllo (1-16 blocchi)
            args:
              course: COURSE
              blocks: BLOCKS
          reset:
            name: reset
            aliases: []
            description: Elimina tutte le volte del corso
            args:
              course: COURSE
          delete:
            name: delete
            aliases: []
            description: Eliminare il corso
            args:
              course: COURSE
      reload:
        name: reload
        aliases: []
        description: Ricarica file di configurazione e lingua
    values:
      ride: "corsa"
      jump: "salto"
      status: "stato"
      stop: ferma

