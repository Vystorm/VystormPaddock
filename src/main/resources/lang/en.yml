commands:
  paddock:
    description: "Claim, protect, stable and summon your horses; herd book and horse races"
    aliases: []
    sub:
      train:
        name: "train"
        aliases: []
        description: "Train your own mount with bounded riding and jumping exercises"
        args:
          exercise: "EXERCISE"
      claim:
        name: claim
        aliases: []
        description: "Claim the tamed animal you look at or ride"
      release:
        name: release
        aliases: []
        description: "Give up your claim on the animal"
      offer:
        name: offer
        aliases: []
        description: "Offer the animal you look at to a player"
        args:
          player: PLAYER
          price: PRICE
      accept:
        name: accept
        aliases: []
        description: "Accept the animal offer you received"
      decline:
        name: decline
        aliases: []
        description: "Decline the animal offer you received"
      trust:
        name: trust
        aliases: []
        description: "Let a player ride and use your animal"
        args:
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: "Take back a player's access to your animal"
        args:
          player: PLAYER
      compare:
        name: compare
        aliases: []
        description: "Compare your ridden horse with the horse you look at"
      info:
        name: info
        aliases: []
        description: "Owner, trusted players, stats and breeding of the animal"
      rename:
        name: rename
        aliases: []
        description: "Give your animal a name"
        args:
          name: NAME
      store:
        name: store
        aliases: []
        description: "Put the animal into your stable"
      list:
        name: list
        aliases: []
        description: "List the animals in your stable"
      stable:
        name: stable
        aliases: []
        description: "Open your stable; optionally search names or English animal types"
        args:
          search: "SEARCH"
      summon:
        name: summon
        aliases: []
        description: "Bring an animal out of your stable"
        args:
          animal: "NUMBER|NAME"
      call:
        name: call
        aliases: []
        description: "Whistle for the animal you rode last"
      herd:
        name: herd
        aliases: []
        description: "Herd book of your animals out in the world; stop ends the guide arrow"
        args:
          stop: stop
      bet:
        name: bet
        aliases: []
        description: "Bet on a rider waiting at a race start: beat or miss their best time"
        args:
          rider: "RIDER"
          side: "beat|miss"
          amount: "AMOUNT"
      race:
        name: race
        aliases: []
        description: "Race courses, records and your times; stop ends your run"
        args:
          course: "COURSE|stop"
      course:
        name: course
        aliases: []
        description: "Lay out and edit race courses"
        sub:
          create:
            name: create
            aliases: []
            description: "New course starting where you stand"
            args:
              course: COURSE
          point:
            name: point
            aliases: []
            description: "Add a checkpoint where you stand (the last one is the finish)"
            args:
              course: COURSE
          undo:
            name: undo
            aliases: []
            description: "Remove the last checkpoint"
            args:
              course: COURSE
          radius:
            name: radius
            aliases: []
            description: "Size of the checkpoints (1-16 blocks)"
            args:
              course: COURSE
              blocks: BLOCKS
          reset:
            name: reset
            aliases: []
            description: "Delete all times of the course"
            args:
              course: COURSE
          delete:
            name: delete
            aliases: []
            description: "Delete the course"
            args:
              course: COURSE
      reload:
        name: reload
        aliases: []
        description: "Reload config and language files"
    values:
      ride: "ride"
      jump: "jump"
      status: "status"
      stop: stop

