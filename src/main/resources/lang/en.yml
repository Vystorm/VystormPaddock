# /paddock through Vystorm Core: description, help and tab completion per player. "aliases" under commands.paddock are
# extra root commands (server-wide, the admin chooses which languages: Core config commands.localized-aliases); "name"
# and "aliases" of a subcommand are accepted in every language, English always works.
compare-ride: "<red>Ride a horse to compare it with another horse."
compare-target: "<red>Look at another horse within reach while riding."
compare-header: "<gold>{ridden} (ridden) → {target} (looked at). Differences: target minus ridden; speed and jump are estimates."
compare-speed: "<gray>Speed (blocks/s): <white>{ridden} → {target}</white> ({delta})"
compare-jump: "<gray>Jump (blocks): <white>{ridden} → {target}</white> ({delta})"
compare-health: "<gray>Max health (❤): <white>{ridden} → {target}</white> ({delta})"

