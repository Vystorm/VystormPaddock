commands:
  paddock:
    description: Reivindicar, proteger, estável e convocar seus cavalos; livro de rebanhos e corridas de cavalos
    aliases: []
    sub:
      train:
        name: "train"
        aliases: []
        description: "Treine sua montaria em corrida e saltos com limites"
        args:
          exercise: "EXERCÍCIO"
      claim:
        name: claim
        aliases: []
        description: Reclame o animal domado que você olha ou monta
      release:
        name: release
        aliases: []
        description: Desista de sua reivindicação sobre o animal
      offer:
        name: offer
        aliases: []
        description: "Oferecer o animal que você olha a um jogador"
        args:
          player: PLAYER
          price: PRICE
      accept:
        name: accept
        aliases: []
        description: "Aceitar a oferta de animal recebida"
      decline:
        name: decline
        aliases: []
        description: "Recusar a oferta de animal recebida"
      trust:
        name: trust
        aliases: []
        description: Deixe um jogador montar e usar seu animal
        args:
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: Retire o acesso de um jogador ao seu animal
        args:
          player: PLAYER
      compare:
        name: compare
        aliases: []
        description: Compare seu cavalo montado com o cavalo que você olha
      info:
        name: info
        aliases: []
        description: Dono, jogadores de confiança, estatísticas e criação do animal
      rename:
        name: rename
        aliases: []
        description: Dê um nome ao seu animal
        args:
          name: NAME
      store:
        name: store
        aliases: []
        description: Coloque o animal em seu estábulo
      list:
        name: list
        aliases: []
        description: Liste os animais em seu estábulo
      stable:
        name: stable
        aliases: []
        description: Abra seu estábulo, opcionalmente procure nomes ou tipos de animais ingleses
        args:
          search: SEARCH
      summon:
        name: summon
        aliases: []
        description: Traga um animal para fora do seu estábulo
        args:
          animal: NUMBER|NAME
      call:
        name: call
        aliases: []
        description: Assobie para o animal que você montou por último
      herd:
        name: herd
        aliases: []
        description: Livro do rebanho de seus animais no mundo, parar termina a seta guia
        args:
          stop: parar
      bet:
        name: bet
        aliases: []
        description: "Apostar em um cavaleiro na largada: bate ou não o próprio recorde"
        args:
          rider: "RIDER"
          side: "beat|miss"
          amount: "AMOUNT"
      race:
        name: race
        aliases: []
        description: Cursos de corrida, registros e seu tempo; parar termina sua corrida
        args:
          course: 'COURSE # stop'
      course:
        name: course
        aliases: []
        description: Defina e edite cursos de corrida
        sub:
          create:
            name: create
            aliases: []
            description: Novo curso começando onde você está
            args:
              course: COURSE
          point:
            name: point
            aliases: []
            description: Adicione um ponto de controle onde você está
            args:
              course: COURSE
          undo:
            name: undo
            aliases: []
            description: Remova o último posto de controle
            args:
              course: COURSE
          radius:
            name: radius
            aliases: []
            description: Tamanho dos postos de controle (1-16 blocos)
            args:
              course: COURSE
              blocks: BLOCKS
          reset:
            name: reset
            aliases: []
            description: Delete todos os tempos do curso
            args:
              course: COURSE
          delete:
            name: delete
            aliases: []
            description: Apague o curso
            args:
              course: COURSE
      reload:
        name: reload
        aliases: []
        description: Recarregar arquivos de configuração e linguagem
    values:
      ride: "correr"
      jump: "saltar"
      status: "estado"
      stop: parar

