# 通过 Vystorm Core 提供的 /paddock：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.paddock 下的 "aliases"
# 是额外的主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和
# "aliases" 在所有语言中都可使用，英文始终有效。
compare-ride: "<red>请先骑上一匹马，再与另一匹马比较。"
compare-target: "<red>骑马时看向范围内的另一匹马。"
compare-header: "<gold>{ridden}（骑乘）→ {target}（目标）。差值：目标减去骑乘；速度和跳跃高度为估算值。"
compare-speed: "<gray>速度（格/秒）: <white>{ridden} → {target}</white> ({delta})"
compare-jump: "<gray>跳跃高度（格）: <white>{ridden} → {target}</white> ({delta})"
compare-health: "<gray>最大生命值（❤）: <white>{ridden} → {target}</white> ({delta})"

menu-page-title: "马厩 {page}/{pages}"
menu-previous: "<yellow>上一页"
menu-next: "<yellow>下一页"
menu-summary: "<gold>马厩 {count}/{max} — {matches} 个结果"
menu-clear: "<yellow>清除搜索：{search}"
menu-no-matches: "<gray>没有匹配的动物"
