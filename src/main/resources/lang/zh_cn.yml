menu-sort-name: "<yellow>排序：名称（点击切换）"
menu-sort-type: "<yellow>排序：动物类型（点击切换）"

commands:
  paddock:
    description: "认领、保护、入厩和召唤你的马；马群簿和赛马"
    aliases: [马场]
    sub:
      train:
        name: "训练"
        aliases: []
        description: "通过有上限的骑行和跳跃训练培养坐骑"
        args:
          exercise: "训练"
      claim:
        name: 认领
        aliases: []
        description: "认领你看着或骑着的已驯服动物"
      release:
        name: 放弃
        aliases: []
        description: "放弃对该动物的认领"
      offer:
        name: offer
        aliases: []
        description: "把你看着的动物出让给一名玩家"
        args:
          player: PLAYER
          price: PRICE
      accept:
        name: accept
        aliases: []
        description: "接受收到的动物交易"
      decline:
        name: decline
        aliases: []
        description: "拒绝收到的动物交易"
      trust:
        name: 信任
        aliases: []
        description: "允许一名玩家骑乘和使用你的动物"
        args:
          player: 玩家
      untrust:
        name: 取消信任
        aliases: []
        description: "收回一名玩家对你的动物的使用权"
        args:
          player: 玩家
      compare:
        name: 比较
        aliases: []
        description: "比较你骑乘的马和你看着的马"
      info:
        name: 信息
        aliases: []
        description: "该动物的主人、受信任玩家、属性和血统"
      rename:
        name: 改名
        aliases: []
        description: "给你的动物起名"
        args:
          name: 名字
      store:
        name: 入厩
        aliases: []
        description: "把动物放进你的马厩"
      list:
        name: 列表
        aliases: []
        description: "列出你马厩里的动物"
      stable:
        name: 马厩
        aliases: []
        description: "打开马厩；可按名称或英文动物类型搜索"
        args:
          search: "搜索内容"
      summon:
        name: 召唤
        aliases: []
        description: "从马厩中召唤一只动物"
        args:
          animal: "编号|名字"
      call:
        name: 呼唤
        aliases: []
        description: "吹口哨呼唤你最后骑过的动物"
      herd:
        name: 马群
        aliases: []
        description: "你在世界中的动物的马群簿；停止 可结束指引箭头"
        args:
          stop: 停止
      bet:
        name: bet
        aliases: []
        description: "押注起点处的骑手：能否打破其个人最佳"
        args:
          rider: "RIDER"
          side: "beat|miss"
          amount: "AMOUNT"
      race:
        name: 赛马
        aliases: []
        description: "赛道、纪录和你的成绩；停止 可结束本次比赛"
        args:
          course: "赛道|停止"
      course:
        name: 赛道
        aliases: []
        description: "布置和编辑赛道"
        sub:
          create:
            name: 创建
            aliases: []
            description: "以你所在位置为起点创建新赛道"
            args:
              course: 赛道
          point:
            name: 检查点
            aliases: []
            description: "在你所在位置添加检查点（最后一个为终点）"
            args:
              course: 赛道
          undo:
            name: 撤销
            aliases: []
            description: "删除最后一个检查点"
            args:
              course: 赛道
          radius:
            name: 半径
            aliases: []
            description: "检查点的大小（1-16 格）"
            args:
              course: 赛道
              blocks: 格数
          reset:
            name: 重置
            aliases: []
            description: "删除该赛道的所有成绩"
            args:
              course: 赛道
          delete:
            name: 删除
            aliases: []
            description: "删除该赛道"
            args:
              course: 赛道
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置和语言文件"
    values:
      ride: "骑行"
      jump: "跳跃"
      status: "状态"
      stop: 停止

