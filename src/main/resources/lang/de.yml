# /paddock über Vystorm Core: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases" unter commands.paddock
# sind zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen: Core-Konfig commands.localized-aliases);
# "name" und "aliases" eines Unterbefehls werden in jeder Sprache verstanden, Englisch geht immer.
