commands:
  paddock:
    description: "Pferde beanspruchen, schützen, einstallen und rufen; Herdenbuch und Pferderennen"
    aliases: [pferdekoppel]
    sub:
      train:
        name: "trainieren"
        aliases: []
        description: "Eigenes Reittier mit begrenzten Reit- und Sprungübungen trainieren"
        args:
          exercise: "ÜBUNG"
      claim:
        name: beanspruchen
        aliases: []
        description: "Das gezähmte Tier, das du ansiehst oder reitest, beanspruchen"
      release:
        name: freigeben
        aliases: []
        description: "Den Anspruch auf das Tier aufgeben"
      offer:
        name: offer
        aliases: []
        description: "Das angeschaute Tier einem Spieler anbieten"
        args:
          player: PLAYER
          price: PRICE
      accept:
        name: accept
        aliases: []
        description: "Das erhaltene Tier-Angebot annehmen"
      decline:
        name: decline
        aliases: []
        description: "Das erhaltene Tier-Angebot ablehnen"
      trust:
        name: vertrauen
        aliases: []
        description: "Einen Spieler dein Tier reiten und benutzen lassen"
        args:
          player: SPIELER
      untrust:
        name: misstrauen
        aliases: [entziehen]
        description: "Einem Spieler den Zugriff auf dein Tier wieder nehmen"
        args:
          player: SPIELER
      compare:
        name: vergleichen
        aliases: []
        description: "Vergleiche dein gerittenes Pferd mit dem angesehenen Pferd"
      info:
        name: info
        aliases: []
        description: "Besitzer, vertraute Spieler, Werte und Abstammung des Tiers"
      rename:
        name: umbenennen
        aliases: []
        description: "Deinem Tier einen Namen geben"
        args:
          name: NAME
      store:
        name: einstallen
        aliases: []
        description: "Das Tier in deinen Stall bringen"
      list:
        name: liste
        aliases: []
        description: "Die Tiere in deinem Stall auflisten"
      stable:
        name: stall
        aliases: []
        description: "Stall öffnen; optional nach Namen oder englischer Tierart suchen"
        args:
          search: "SUCHTEXT"
      summon:
        name: herbeirufen
        aliases: [holen]
        description: "Ein Tier aus deinem Stall holen"
        args:
          animal: "NUMMER|NAME"
      call:
        name: pfeifen
        aliases: []
        description: "Nach dem Tier pfeifen, das du zuletzt geritten hast"
      herd:
        name: herde
        aliases: [herdenbuch]
        description: "Herdenbuch deiner Tiere draußen in der Welt; stopp beendet den Wegpfeil"
        args:
          stop: stopp
      bet:
        name: bet
        aliases: []
        description: "Auf einen Reiter am Start wetten: schlägt oder verfehlt er seine Bestzeit"
        args:
          rider: "RIDER"
          side: "beat|miss"
          amount: "AMOUNT"
      race:
        name: rennen
        aliases: []
        description: "Rennstrecken, Rekorde und deine Zeiten; stopp beendet deinen Lauf"
        args:
          course: "STRECKE|stopp"
      course:
        name: strecke
        aliases: []
        description: "Rennstrecken anlegen und bearbeiten"
        sub:
          create:
            name: erstellen
            aliases: []
            description: "Neue Strecke mit Start dort, wo du stehst"
            args:
              course: STRECKE
          point:
            name: punkt
            aliases: []
            description: "Kontrollpunkt dort setzen, wo du stehst (der letzte ist das Ziel)"
            args:
              course: STRECKE
          undo:
            name: rueckgaengig
            aliases: [rückgängig]
            description: "Den letzten Kontrollpunkt entfernen"
            args:
              course: STRECKE
          radius:
            name: radius
            aliases: []
            description: "Größe der Kontrollpunkte (1-16 Blöcke)"
            args:
              course: STRECKE
              blocks: BLÖCKE
          reset:
            name: zuruecksetzen
            aliases: [zurücksetzen]
            description: "Alle Zeiten der Strecke löschen"
            args:
              course: STRECKE
          delete:
            name: loeschen
            aliases: [löschen]
            description: "Die Strecke löschen"
            args:
              course: STRECKE
      reload:
        name: neuladen
        aliases: []
        description: "Konfiguration und Sprachdateien neu laden"
    values:
      ride: "reiten"
      jump: "springen"
      status: "status"
      stop: stopp

