commands:
  paddock:
    description: Утверждайте, защищайте, уравновешивайте и призывайте своих лошадей; книга стада и скачки
    aliases: []
    sub:
      train:
        name: "train"
        aliases: []
        description: "Тренируйте свою верховую особь с ограниченным ростом характеристик"
        args:
          exercise: "УПРАЖНЕНИЕ"
      claim:
        name: claim
        aliases: []
        description: Заявите о прирученном животном, на которое вы смотрите или на котором катаетесь
      release:
        name: release
        aliases: []
        description: Откажитесь от претензий на животное
      offer:
        name: offer
        aliases: []
        description: "Предложить животное, на которое вы смотрите, игроку"
        args:
          player: PLAYER
          price: PRICE
      accept:
        name: accept
        aliases: []
        description: "Принять полученное предложение"
      decline:
        name: decline
        aliases: []
        description: "Отклонить полученное предложение"
      trust:
        name: trust
        aliases: []
        description: Позвольте игроку ездить и использовать ваше животное
        args:
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: Верните доступ игрока к вашему животному
        args:
          player: PLAYER
      compare:
        name: compare
        aliases: []
        description: Сравните свою лошадь с лошадью, на которую вы смотрите
      info:
        name: info
        aliases: []
        description: Владелец, доверенные игроки, статистика и разведение животного
      rename:
        name: rename
        aliases: []
        description: Дайте своему животному имя
        args:
          name: NAME
      store:
        name: store
        aliases: []
        description: Поместите животное в конюшню
      list:
        name: list
        aliases: []
        description: Перечислите животных в вашей конюшне
      stable:
        name: stable
        aliases: []
        description: Откройте свою конюшню; необязательно имена поиска или английские типы животных
        args:
          search: SEARCH
      summon:
        name: summon
        aliases: []
        description: Выведите животное из своей конюшни
        args:
          animal: NUMBER|NAME
      call:
        name: call
        aliases: []
        description: Свисток для животного, на котором вы ездили в последний раз
      herd:
        name: herd
        aliases: []
        description: 'Оригинальное название: Herd Book of Your Animals Out in the World: Stop Ends the Guide arrow'
        args:
          stop: остановить
      bet:
        name: bet
        aliases: []
        description: "Ставка на всадника на старте: побьёт ли он свой рекорд"
        args:
          rider: "RIDER"
          side: "beat|miss"
          amount: "AMOUNT"
      race:
        name: race
        aliases: []
        description: Гоночные курсы, записи и ваше время; остановите свой бег
        args:
          course: COURSE |стоп
      course:
        name: course
        aliases: []
        description: Выложить и отредактировать гоночные курсы
        sub:
          create:
            name: create
            aliases: []
            description: Новый курс начинается там, где вы стоите
            args:
              course: COURSE
          point:
            name: point
            aliases: []
            description: Добавьте контрольный пункт, где вы стоите (последний - финиш)
            args:
              course: COURSE
          undo:
            name: undo
            aliases: []
            description: Удалить последний контрольный пункт
            args:
              course: COURSE
          radius:
            name: radius
            aliases: []
            description: Размер КПП (1-16 блоков)
            args:
              course: COURSE
              blocks: BLOCKS
          reset:
            name: reset
            aliases: []
            description: Удалить все время курса
            args:
              course: COURSE
          delete:
            name: delete
            aliases: []
            description: Удалить курс
            args:
              course: COURSE
      reload:
        name: reload
        aliases: []
        description: Перезагрузка конфигурационных и языковых файлов
    values:
      ride: "езда"
      jump: "прыжок"
      status: "статус"
      stop: остановить

