commands:
  paddock:
    description: Réclamez, protégez, stablez et convoquez vos chevaux; livre de troupeaux et courses de chevaux
    aliases: []
    sub:
      train:
        name: "train"
        aliases: []
        description: "Entraînez votre monture à la course et au saut avec des limites"
        args:
          exercise: "EXERCICE"
      claim:
        name: claim
        aliases: []
        description: Déclarez l'animal dompté que vous regardez ou chevauchez
      release:
        name: release
        aliases: []
        description: Laissez tomber votre réclamation sur l'animal
      offer:
        name: offer
        aliases: []
        description: "Proposer l’animal regardé à un joueur"
        args:
          player: PLAYER
          price: PRICE
      accept:
        name: accept
        aliases: []
        description: "Accepter l’offre d’animal reçue"
      decline:
        name: decline
        aliases: []
        description: "Refuser l’offre d’animal reçue"
      trust:
        name: trust
        aliases: []
        description: Laissez un joueur monter et utiliser votre animal
        args:
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: Reprenez l'accès d'un joueur à votre animal
        args:
          player: PLAYER
      compare:
        name: compare
        aliases: []
        description: Comparez votre cheval avec le cheval que vous regardez
      info:
        name: info
        aliases: []
        description: Propriétaire, joueurs de confiance, statistiques et élevage de l'animal
      rename:
        name: rename
        aliases: []
        description: Donnez un nom à votre animal
        args:
          name: NAME
      store:
        name: store
        aliases: []
        description: Mettez l'animal dans votre écurie
      list:
        name: list
        aliases: []
        description: Lister les animaux dans votre écurie
      stable:
        name: stable
        aliases: []
        description: Ouvrez votre écurie; en option, recherchez des noms ou des types d'animaux anglais
        args:
          search: SEARCH
      summon:
        name: summon
        aliases: []
        description: Faites sortir un animal de votre écurie
        args:
          animal: NUMBER|NAME
      call:
        name: call
        aliases: []
        description: Whistle pour l'animal que tu as pris en dernier
      herd:
        name: herd
        aliases: []
        description: Livre de troupeau de vos animaux dehors dans le monde; stop termine la flèche guide
        args:
          stop: arrêter
      bet:
        name: bet
        aliases: []
        description: "Parier sur un cavalier au départ : bat-il son record ou non"
        args:
          rider: "RIDER"
          side: "beat|miss"
          amount: "AMOUNT"
      race:
        name: race
        aliases: []
        description: Courses, records et votre temps; stop termine votre course
        args:
          course: COURSEArrêt
      course:
        name: course
        aliases: []
        description: Planifier et modifier les cours de course
        sub:
          create:
            name: create
            aliases: []
            description: Nouveau cours commençant là où vous vous trouvez
            args:
              course: COURSE
          point:
            name: point
            aliases: []
            description: Ajoutez un point de contrôle où vous vous tenez (le dernier est l'arrivée)
            args:
              course: COURSE
          undo:
            name: undo
            aliases: []
            description: Supprimer le dernier point de contrôle
            args:
              course: COURSE
          radius:
            name: radius
            aliases: []
            description: Taille des postes de contrôle (1-16 blocs)
            args:
              course: COURSE
              blocks: BLOCKS
          reset:
            name: reset
            aliases: []
            description: Supprimer toutes les heures du cours
            args:
              course: COURSE
          delete:
            name: delete
            aliases: []
            description: Supprimer le cours
            args:
              course: COURSE
      reload:
        name: reload
        aliases: []
        description: Recharger les fichiers de configuration et de langue
    values:
      ride: "course"
      jump: "saut"
      status: "statut"
      stop: arrêter

